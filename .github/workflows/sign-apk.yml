name: Assinar APK

on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Renomear APK (remover espaços)
        run: mv "Sempre Juntos-unsigned.apk" app-unsigned.apk

      - name: Decodificar keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > semprejuntos.keystore

      - name: Baixar uber-apk-signer
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Assinar APK
        run: |
          java -jar uber-apk-signer-1.3.0.jar \
            --apks app-unsigned.apk \
            --ks semprejuntos.keystore \
            --ksAlias "${{ secrets.KEY_ALIAS }}" \
            --ksPass "${{ secrets.KEYSTORE_PASSWORD }}" \
            --ksKeyPass "${{ secrets.KEY_PASSWORD }}" \
            --allowResign

      - name: Listar arquivos gerados
        run: ls -la

      - name: Enviar APK assinado como artefato
        uses: actions/upload-artifact@v4
        with:
          name: SempreJuntos-APK-assinado
          path: "*-signed.apk"
